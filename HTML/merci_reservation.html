<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation confirmée - Yummy</title>
    <link rel="stylesheet" href="../Style/style.css">
    <style>
        .thank-you-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .thank-you-icon {
            font-size: 60px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .thank-you-title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }
        .thank-you-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
            line-height: 1.6;
        }
        .back-home-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #d4a762;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-home-btn:hover {
            background-color: #c29554;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="thank-you-title">Merci pour votre réservation!</h1>
        <div class="thank-you-message">
            <p>Nous avons bien reçu votre demande de réservation.</p>
            <p>Notre équipe va la traiter et vous confirmer la disponibilité sous peu par email ou téléphone.</p>
            <p>En cas de modification ou d'annulation, n'hésitez pas à nous contacter au +213 789 01 23 70.</p>
        </div>
        <a href="../HTML/index.html" class="back-home-btn">Retour à l'accueil</a>


    </div>
    
    <!-- Lien vers Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
